<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameFinder — Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 2.5rem;
      font-size: 0.9rem;
    }

    #services {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .service-row {
      background: #1e293b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .service-name {
      font-weight: 500;
      font-size: 1rem;
    }

    .badge {
      padding: 0.25rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-up      { background: #166534; color: #bbf7d0; }
    .badge-down    { background: #7f1d1d; color: #fecaca; }
    .badge-loading { background: #1e3a5f; color: #93c5fd; }
    .badge-error   { background: #4a1d2e; color: #fda4af; }

    footer {
      margin-top: 2.5rem;
      color: #475569;
      font-size: 0.8rem;
    }

    #ts { color: #64748b; }
  </style>
</head>
<body>
  <h1>GameFinder</h1>
  <p class="subtitle">System Status — auto-refreshes every 30s</p>

  <div id="services">
    <!-- populated by renderServices() -->
  </div>

  <footer>Last updated: <span id="ts">—</span></footer>

  <script>
    // Services to monitor — name shown on page, query sent to Prometheus
    // /prom/ is a nginx proxy to Prometheus (avoid HTTPS/HTTP mixed content)
    const SERVICES = [
      { name: 'Prometheus',  query: 'up{job="prometheus"}' },
      { name: 'PostgreSQL',  query: 'pg_up' },
      { name: 'Nginx',       query: 'up{job="nginx"}' },
      { name: 'Backend',     query: 'probe_success{job="backend-ping"}' },
    ];

    async function fetchStatus(query) {
      try {
        const res = await fetch('/prom/api/v1/query?query=' + encodeURIComponent(query));
        if (!res.ok) return null;
        const json = await res.json();
        const result = json.data.result;
        if (result.length === 0) return null;
        return Number(result[0].value[1]);
      } catch (e) {
        return null;
      }
    }

    async function renderServices() {
      const container = document.getElementById('services');

      // Show loading badges while fetching
      container.innerHTML = SERVICES.map(s => `
        <div class="service-row">
          <span class="service-name">${s.name}</span>
          <span class="badge badge-loading">Checking…</span>
        </div>
      `).join('');

      const statuses = await Promise.all(SERVICES.map(s => fetchStatus(s.query)));

      container.innerHTML = SERVICES.map((s, i) => {
        const v = statuses[i];
        const badgeClass = v === null ? 'badge-error' : v === 1 ? 'badge-up' : 'badge-down';
        const label     = v === null ? 'Unknown'      : v === 1 ? 'Operational' : 'Down';
        return `
          <div class="service-row">
            <span class="service-name">${s.name}</span>
            <span class="badge ${badgeClass}">${label}</span>
          </div>
        `;
      }).join('');

      document.getElementById('ts').textContent = new Date().toLocaleTimeString();
    }

    async function refresh() {
      await renderServices();
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
