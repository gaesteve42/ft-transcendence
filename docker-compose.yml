services:
  postgres:
    image: postgres:16
    container_name: gamefinder_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gamefinder_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamefinder_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - gamefinder_network

  backend:
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamefinder_backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
    networks:
      - gamefinder_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gamefinder_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - gamefinder_network

  nginx:
    image: nginx:alpine
    container_name: gamefinder_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gamefinder_network
  
  recommendation:
    build:
      context: ./recommendation
      dockerfile: Dockerfile
    environment:
        - DATABASE_URL=${DATABASE_URL}
    depends_on:
        - backend
        - postgres
    networks: 
        - gamefinder_network
    ports:
        - "8001:8001"

volumes:
  postgres_data:

networks:
  gamefinder_network:
    driver: bridge