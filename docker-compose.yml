services:
  postgres:
    image: postgres:16
    container_name: gamefinder_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gamefinder_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamefinder_pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - postgres
    networks:
      - gamefinder_network

  backend:
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamefinder_backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamefinder_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3001/api/lobbies/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gamefinder_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - gamefinder_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: gamefinder_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./status:/etc/nginx/status:ro
      - /home/deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - gamefinder_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  recommendation:
    container_name: gamefinder_recommendation
    restart: unless-stopped
    build:
      context: ./recommendation
      dockerfile: Dockerfile
    environment:
        - DATABASE_URL=${RECOMMENDATION_DATABASE_URL}
    depends_on:
        - backend
        - postgres
    networks:
        - gamefinder_network
    ports:
        - "127.0.0.1:8001:8001"

  prometheus:
    image: prom/prometheus
    container_name: gamefinder_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gamefinder_network

  grafana:
    image: grafana/grafana
    container_name: gamefinder_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - gamefinder_network
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: false
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
  
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: gamefinder_postgres_exporter
    restart: unless-stopped
    volumes:
      - ./prometheus/queries.yaml:/queries.yaml:ro
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml
    depends_on:
      - postgres
    networks:
      - gamefinder_network
  
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: gamefinder_nginx_exporter
    restart: unless-stopped
    networks:
      - gamefinder_network
    depends_on:
      - nginx
    command: --nginx.scrape-uri=http://nginx:80/stub_status

  blackbox-exporter:
    image: prom/blackbox-exporter
    container_name: gamefinder_blackbox_exporter
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - gamefinder_network
    depends_on:
      - backend
  
  loki:
    image: grafana/loki:latest
    container_name: gamefinder_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - gamefinder_network

  promtail:
    image: grafana/promtail:latest
    container_name: gamefinder_promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - gamefinder_network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  gamefinder_network:
    driver: bridge