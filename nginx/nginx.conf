events
{
	worker_connections 1024;
}

http
{
	#handle redirection from http to https
	server
	{
		listen 80;

		location = /stub_status
		{
			stub_status;
			allow 172.0.0.0/8;
			deny all;
		}

		# Internal health check endpoint
		location = /health
		{
			return 200 "OK\n";
			add_header Content-Type text/plain;
		}

		location /
		{
			return 301 https://gamefinder.quest$request_uri;
		}
	}

	server
	{
		# handling auto-signed certificate part.
		listen 443 ssl;
		ssl_certificate /etc/nginx/ssl/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl/nginx.key;

		# Backend API proxy
		location /api
		{
			proxy_pass http://backend:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# WebSocket proxy (Socket.io → backend)
		location /socket.io
		{
			proxy_pass http://backend:3001;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Frontend proxy (Vite dev server)
		location /
		{
			proxy_pass http://frontend:5173;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# WebSocket support for Vite HMR (Hot Module Replacement)
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		# metrics exposition for Nginx
		location = /stub_status
		{
    		stub_status;
			allow 172.0.0.0/8; # internal docker network
			deny all;
		}

		# Prometheus proxy for status page request
		location /prom/
		{
			proxy_pass http://prometheus:9090/;
			proxy_set_header Host $host;
		}

		# Static status page
		location = /status
		{
			return 301 /status/;
		}

		location /status/
		{
			alias /etc/nginx/status/;
			index index.html;
			try_files $uri $uri/ =404;
		}
	}
}
