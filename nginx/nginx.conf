events
{
	worker_connections 1024;
}

http
{
	#handle redirection from http to https
	server
	{
		listen 80;

		location = /stub_status
		{
			stub_status;
			allow 172.0.0.0/8;
			deny all;
		}

		# internal health check endpoint
		location = /health
		{
			return 200 "OK\n";
			add_header Content-Type text/plain;
		}

		location /
		{
			return 301 https://gamefinder.quest$request_uri;
		}
	}

	server
	{
		# cloudflare certificates
		listen 443 ssl;
		ssl_certificate /etc/nginx/ssl/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl/nginx.key;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		
		client_max_body_size 5m;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

		# Backend API proxy
		location /api
		{
			proxy_pass http://backend:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# WebSocket proxy (Socket.io → backend)
		location /socket.io
		{
			proxy_pass http://backend:3001;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Frontend proxy (Vite dev server)
		location /
		{
			proxy_pass http://frontend:5173;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# WebSocket support for Vite HMR (Hot Module Replacement)
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		# metrics exposition for Nginx
		location = /stub_status
		{
			stub_status;
			allow 172.0.0.0/8; # internal docker network
			deny all;
		}

		# prometheus proxy protected by basic auth
		location /prom/
		{
			proxy_pass http://prometheus:9090/;
			proxy_set_header Host $host;
			auth_basic "Restricted";
			auth_basic_user_file /etc/nginx/.htpasswd;
		}

		# Static status page
		location = /status
		{
			return 301 /status/;
		}

		location /status/
		{
			alias /etc/nginx/status/;
			index index.html;
			try_files $uri $uri/ =404;
			auth_basic "Restricted";
			auth_basic_user_file /etc/nginx/.htpasswd;
		}
	}
}
