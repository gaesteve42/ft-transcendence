# global config for gamefinder
global:
  scrape_interval: 15s

# services scrapping rules
scrape_configs:
  - job_name: prometheus
    static_configs:
     - targets: ['localhost:9090']
  - job_name: postgres
    static_configs:
     - targets: ['postgres-exporter:9187']
  - job_name: nginx
    static_configs:
     - targets: ['nginx-exporter:9113']