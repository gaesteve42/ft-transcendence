# global config for gamefinder
global:
  scrape_interval: 15s

# services scrapping rules
scrape_configs:
  - job_name: prometheus
    static_configs:
     - targets: ['localhost:9090']
  - job_name: postgres
    static_configs:
     - targets: ['postgres-exporter:9187']
  - job_name: nginx
    static_configs:
     - targets: ['nginx-exporter:9113']
  - job_name: backend-ping
    metrics_path: /probe                                                                                                         
    params:
      module: [http_2xx]                                                                 
    static_configs:                                                                                                              
      - targets:
          - http://backend:3001/api/lobbies/ping
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
